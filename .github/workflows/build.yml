name: Build Day Log APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o daylog-project.zip -d src
          ls -la src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayLog-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (direct download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Day Log APK ${{ github.run_number }}
          files: src/app/build/outputs/apk/debug/app-debug.apk

  dashboard:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o daylog-project.zip -d src
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/docs
      - uses: actions/deploy-pages@v4
